  #     - name: Restart app with PM2
  #       run: |
  #         pm2 delete oneinsurance || true
  #         pm2 start "npx next start" --name "oneinsurance"
  #         pm2 save
  deploy:
    runs-on: self-hosted
    needs: build
  
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ecommerce-build
  
      - name: Prepare deploy folder
        run: |
          mkdir -p /var/www/oneinsurance
          rm -rf /var/www/oneinsurance/*
  
      - name: Extract build
        run: |
          tar -xzf ecommerce-build.tar.gz -C /var/www/oneinsurance
          rm ecommerce-build.tar.gz
  
      - name: Use Node.js 22
        run: |
          source ~/.nvm/nvm.sh
          nvm use 22
  
      - name: Restart app with PM2
        run: |
          pm2 delete oneinsurance || true
          pm2 start "npx next start" --name "oneinsurance" --cwd /var/www/oneinsurance
          pm2 save

  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Delete old artifacts
        run: |
          REPO=${{ github.repository }}
          echo "Cleaning up old artifacts from $REPO"
          gh api repos/$REPO/actions/artifacts --paginate -q '.artifacts[].id' | while read -r id; do
            gh api repos/$REPO/actions/artifacts/$id -X DELETE
            echo "Deleted artifact $id"
          done
