name: Deploy OneInsurance App

on:
  push:
    branches:
      - feature/health-insurance
    paths:
      - "ecommerce/**"
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate .env file
        working-directory: ecommerce
        run: |
          cat <<EOF > .env
          NEXT_PUBLIC_BASE_URL=${{ secrets.BASE_URL }}
          NEXT_PUBLIC_TOKEN=${{ secrets.NEXT_PUBLIC_TOKEN }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          BASE_URL=${{ secrets.BASE_URL }}
          PAYMENT_BASE_URL=${{ secrets.PAYMENT_BASE_URL }}
          PAYMENT_CLIENT_ID=${{ secrets.PAYMENT_CLIENT_ID }}
          PAYMENT_CLIENT_SECRET=${{ secrets.PAYMENT_CLIENT_SECRET }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          MERCHANT_ACCOUNT_ID=${{ secrets.MERCHANT_ACCOUNT_ID }}
          NEXT_PUBLIC_REVERB_APP_ID=${{ secrets.NEXT_PUBLIC_REVERB_APP_ID }}
          NEXT_PUBLIC_REVERB_APP_KEY=${{ secrets.NEXT_PUBLIC_REVERB_APP_KEY }}
          NEXT_PUBLIC_REVERB_APP_SECRET=${{ secrets.NEXT_PUBLIC_REVERB_APP_SECRET }}
          NEXT_PUBLIC_REVERB_HOST=${{ secrets.NEXT_PUBLIC_REVERB_HOST }}
          NEXT_PUBLIC_REVERB_PORT=${{ secrets.NEXT_PUBLIC_REVERB_PORT }}
          NEXT_PUBLIC_REVERB_SCHEME=${{ secrets.NEXT_PUBLIC_REVERB_SCHEME }}
          NEXT_PUBLIC_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_ACCESS_TOKEN }}
          EOF

      - name: Install dependencies
        working-directory: ecommerce
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build app
        working-directory: ecommerce
        run: |
          npm run build

      - name: Archive build
        working-directory: ecommerce
        run: |
          tar -czf ecommerce-build.tar.gz .next node_modules public package.json package-lock.json next.config.ts tsconfig.json .env auth.db

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-build
          path: ecommerce/ecommerce-build.tar.gz

  deploy:
    runs-on: self-hosted
    needs: build
  
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ecommerce-build
  
      - name: Prepare deploy folder
        run: |
          DEPLOY_DIR="${{ github.workspace }}/deploy-ecommerce"
          mkdir -p "$DEPLOY_DIR"
          rm -rf "$DEPLOY_DIR"/*
  
      - name: Extract build
        run: |
          DEPLOY_DIR="${{ github.workspace }}/deploy-ecommerce"
          tar -xzf ecommerce-build.tar.gz -C "$DEPLOY_DIR"
          rm ecommerce-build.tar.gz
  
      - name: Use Node.js 22
        run: |
          source ~/.nvm/nvm.sh
          nvm use 22
  
      - name: Restart app with PM2
        run: |
          DEPLOY_DIR="${{ github.workspace }}/deploy-ecommerce"
          pm2 delete oneinsurance || true
          pm2 start "npx next start" --name "oneinsurance" --cwd "$DEPLOY_DIR"
          pm2 save

  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Delete old artifacts
        run: |
          REPO=${{ github.repository }}
          echo "Cleaning up old artifacts from $REPO"
          gh api repos/$REPO/actions/artifacts --paginate -q '.artifacts[].id' | while read -r id; do
            gh api repos/$REPO/actions/artifacts/$id -X DELETE
            echo "Deleted artifact $id"
          done
