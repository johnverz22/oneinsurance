name: Check Logs

on:
  workflow_dispatch:

jobs:
  check-status:
    runs-on: self-hosted  

    steps:
      - name: Check directories
        run: |
          ls

      - name: Check e-commerce logs
        run: |
          pm2 logs oneinsurance --nostream | tail -n 100

      - name: Check agent logs
        run: |
          pm2 logs oneinsurance-agent --nostream | tail -n 100

      - name: Check admin logs
        run: |
          pm2 logs oneinsurance-admin --nostream | tail -n 100
