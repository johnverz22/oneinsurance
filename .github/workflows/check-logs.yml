name: Check Logs

on:
  workflow_dispatch:

jobs:
  check-status:
    runs-on: self-hosted  
    steps:
      - name: Check directories and delete extra files
        run: |
          ls | grep -v -E 'deploy-admin|deploy-agent|deploy-ecommerce' | xargs rm -rf
          ls
          
      - name: Check e-commerce logs
        run: |
          pm2 logs oneinsurance
          
      - name: Check agent logs
        run: |
          pm2 logs oneinsurance-agent
          
      - name: Check admin logs
        run: |
          pm2 logs oneinsurance-admin
