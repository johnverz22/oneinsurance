name: Deploy OneInsurance App - Admin

on:
  push:
    branches:
      - main
    paths:
      - "admin/**" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate .env file
        working-directory: admin
        run: |
          cat <<EOF > .env
          NEXT_PUBLIC_TOKEN=${{ secrets.NEXT_PUBLIC_TOKEN }}
          NEXT_PUBLIC_STORAGE_SECRET=${{ secrets.NEXT_PUBLIC_STORAGE_SECRET }}
          NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_AFFILIATE_BASE_URL=${{ secrets.NEXT_PUBLIC_AFFILIATE_BASE_URL }}
          EOF

      - name: Clean and install prod dependencies
        working-directory: admin
        run: |
          rm -f package-lock.json
          npm install

      - name: Build app
        working-directory: admin
        run: |
          npm run build
          npm prune --omit=dev

      - name: Archive build
        working-directory: admin
        run: |
          tar -czf admin-build.tar.gz .next node_modules public package.json package-lock.json next.config.ts tsconfig.json .env auth.db

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: admin/admin-build.tar.gz

  deploy:
    runs-on: self-hosted
    needs: build
  
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-build
  
      - name: Prepare deploy folder
        run: |
          DEPLOY_DIR="${{ github.workspace }}/deploy-admin"
          mkdir -p "$DEPLOY_DIR"
          rm -rf "$DEPLOY_DIR"/*
  
      - name: Extract build
        run: |
          DEPLOY_DIR="${{ github.workspace }}/deploy-admin"
          tar -xzf admin-build.tar.gz -C "$DEPLOY_DIR"
          rm admin-build.tar.gz
  
      - name: Use Node.js 22
        run: |
          source ~/.nvm/nvm.sh
          nvm use 22
  
      - name: Restart app with PM2
        run: |
          DEPLOY_DIR="${{ github.workspace }}/deploy-admin"
          pm2 delete oneinsurance-admin || true
          PORT=5000 pm2 start "npx next start" --name "oneinsurance-admin" --cwd "$DEPLOY_DIR"
          pm2 save

  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Delete old artifacts
        run: |
          REPO=${{ github.repository }}
          echo "Cleaning up old artifacts from $REPO"
          gh api repos/$REPO/actions/artifacts --paginate -q '.artifacts[].id' | while read -r id; do
            gh api repos/$REPO/actions/artifacts/$id -X DELETE
            echo "Deleted artifact $id"
          done
